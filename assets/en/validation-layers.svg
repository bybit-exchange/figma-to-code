<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" width="680" height="530" role="img" aria-labelledby="title desc">
<title id="title">4-Layer Validation Scoring Pipeline</title>
<desc id="desc">P1 code passes asset, static-rule, and compile checks before scoring and the P3 decision.</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<rect width="680" height="530" fill="#fff"/>
<text x="340" y="30" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">4-Layer Validation Scoring Pipeline</text>
<rect x="230" y="50" width="220" height="39" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="340" y="75" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="600">P1 Code Output (Staging)</text>
<rect x="20" y="113" width="640" height="75" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
<text x="60" y="155" font-size="11" fill="#b45309" text-anchor="middle">Layer 0</text>
<rect x="100" y="129" width="245" height="43" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
<text x="222.5" y="148" font-size="11" fill="#92400e" text-anchor="middle">Asset Landing Check</text>
<text x="222.5" y="163" font-size="10" fill="#92400e" text-anchor="middle">Image/SVG refs exist · auto-complete</text>
<rect x="370" y="129" width="270" height="43" rx="7" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
<text x="505" y="148" font-size="10" fill="#b91c1c" text-anchor="middle">Missing: flag &amp; deduct</text>
<text x="505" y="163" font-size="9" fill="#b91c1c" text-anchor="middle">Auto-retry download</text>
<path d="M350 150.5 L356 150.5" fill="none" stroke="#ef4444" stroke-width="1.6"/><path d="M356 145.5 L365 150.5 L356 155.5 Z" fill="#ef4444"/>
<rect x="20" y="208" width="640" height="75" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
<text x="60" y="250" font-size="11" fill="#b45309" text-anchor="middle">Layer 1</text>
<rect x="100" y="224" width="245" height="43" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
<text x="222.5" y="243" font-size="11" fill="#92400e" text-anchor="middle">Static Rule Check</text>
<text x="222.5" y="258" font-size="10" fill="#92400e" text-anchor="middle">Sass vars · flex/position validity</text>
<rect x="370" y="224" width="270" height="43" rx="7" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
<text x="505" y="243" font-size="10" fill="#b91c1c" text-anchor="middle">Violation: locate &amp; deduct</text>
<text x="505" y="258" font-size="9" fill="#b91c1c" text-anchor="middle">Point to validation-guide</text>
<path d="M350 245.5 L356 245.5" fill="none" stroke="#ef4444" stroke-width="1.6"/><path d="M356 240.5 L365 245.5 L356 250.5 Z" fill="#ef4444"/>
<rect x="20" y="303" width="640" height="75" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
<text x="60" y="345" font-size="11" fill="#b45309" text-anchor="middle">Layer 2</text>
<rect x="100" y="319" width="245" height="43" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
<text x="222.5" y="338" font-size="11" fill="#92400e" text-anchor="middle">Compile Check</text>
<text x="222.5" y="353" font-size="10" fill="#92400e" text-anchor="middle">Less/Scss syntax · NaN/undefined values</text>
<rect x="370" y="319" width="270" height="43" rx="7" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3"/>
<text x="505" y="338" font-size="10" fill="#b91c1c" text-anchor="middle">Compile fail: deduct</text>
<text x="505" y="353" font-size="9" fill="#b91c1c" text-anchor="middle">Force fix then re-run</text>
<path d="M350 340.5 L356 340.5" fill="none" stroke="#ef4444" stroke-width="1.6"/><path d="M356 335.5 L365 340.5 L356 345.5 Z" fill="#ef4444"/>
<rect x="220" y="398" width="240" height="39" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="340" y="423" font-size="12" fill="#1e293b" text-anchor="middle">Composite Score (max 100)</text>
<polygon points="340,457 420,481 340,505 260,481" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="340" y="485" font-size="11" fill="#1e293b" text-anchor="middle">≥ 90 ?</text>
<rect x="95" y="460" width="120" height="43" rx="7" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="155" y="478" font-size="11" fill="#b91c1c" text-anchor="middle">Retry P1</text>
<text x="155" y="492" font-size="9" fill="#b91c1c" text-anchor="middle">Max 3 retries</text>
<rect x="465" y="460" width="120" height="43" rx="7" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="525" y="485" font-size="11" fill="#166534" text-anchor="middle">Land to P3</text>
<text x="238" y="465" font-size="10" fill="#b91c1c" text-anchor="middle">Fail</text>
<text x="442" y="465" font-size="10" fill="#166534" text-anchor="middle">Pass</text>
<path d="M340 94 L340 99" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M335 99 L340 108 L345 99 Z" fill="#94a3b8"/>
<path d="M340 192 L340 194" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M335 194 L340 203 L345 194 Z" fill="#94a3b8"/>
<path d="M340 287 L340 289" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M335 289 L340 298 L345 289 Z" fill="#94a3b8"/>
<path d="M340 382 L340 384" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M335 384 L340 393 L345 384 Z" fill="#94a3b8"/>
<path d="M340 441 L340 443" fill="none" stroke="#94a3b8" stroke-width="1.6"/><path d="M335 443 L340 452 L345 443 Z" fill="#94a3b8"/>
<path d="M255 481 L229 481" fill="none" stroke="#ef4444" stroke-width="1.6"/><path d="M229 476 L220 481 L229 486 Z" fill="#ef4444"/>
<path d="M425 481 L451 481" fill="none" stroke="#22c55e" stroke-width="1.6"/><path d="M451 476 L460 481 L451 486 Z" fill="#22c55e"/>
</svg>
