<svg viewBox="20 0 525 575" width="525" height="575" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<marker id="aw" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#94a3b8"/></marker>
<marker id="ag" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker>
<marker id="ar" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker>
</defs>
<rect x="20" y="0" width="525" height="575" fill="#fff"/>

<text x="282.5" y="36" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Code Connect 组件匹配决策流程</text>
<rect x="45" y="56" width="250" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="170" y="81" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="600">IR 节点：isComponentInstance = true</text>
<path d="M170,101 L170,115" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aw)"/>
<rect x="45" y="126" width="250" height="40" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="170" y="151" font-size="12" fill="#6b21a8" text-anchor="middle">查询 Code Connect 映射</text>
<path d="M170,171 L170,185" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aw)"/>
<polygon points="170,196 260,228 170,260 80,228" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="170" y="232" font-size="11" fill="#1e293b" text-anchor="middle">命中？</text>
<path d="M265,228 L299,228" fill="none" stroke="#22c55e" stroke-width="1.5"/><path d="M299,223 L305,228 L299,233 Z" fill="#22c55e"/>
<text x="285" y="216" font-size="10" fill="#166534" text-anchor="middle">命中</text>
<rect x="310" y="202" width="210" height="52" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="415" y="223" font-size="10" fill="#166534" text-anchor="middle">直接使用 Moly 组件</text>
<text x="415" y="239" font-size="10" fill="#166534" text-anchor="middle">&lt;Button variant=&quot;primary&quot;&gt;</text>
<path d="M170,265 L170,279" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="190" y="280" font-size="10" fill="#b45309" text-anchor="start">未命中</text>
<rect x="45" y="290" width="250" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="170" y="315" font-size="12" fill="#b45309" text-anchor="middle">search_components 搜索</text>
<path d="M170,335 L170,349" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aw)"/>
<polygon points="170,360 260,392 170,424 80,392" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="170" y="396" font-size="11" fill="#1e293b" text-anchor="middle">搜到？</text>
<path d="M265,392 L299,392" fill="none" stroke="#22c55e" stroke-width="1.5"/><path d="M299,387 L305,392 L299,397 Z" fill="#22c55e"/>
<text x="285" y="380" font-size="10" fill="#166534" text-anchor="middle">搜到</text>
<rect x="310" y="366" width="210" height="52" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
<text x="415" y="388" font-size="10" fill="#166534" text-anchor="middle">用户确认后</text>
<text x="415" y="404" font-size="10" fill="#166534" text-anchor="middle">使用匹配组件</text>
<path d="M170,429 L170,443" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aw)"/>
<text x="190" y="444" font-size="10" fill="#64748b" text-anchor="start">未搜到</text>
<rect x="45" y="454" width="250" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="170" y="480" font-size="12" fill="#475569" text-anchor="middle">fallback：手写 &lt;div&gt;</text>
<text x="170" y="498" font-size="10" fill="#64748b" text-anchor="middle">CSS 还原，保留组件结构</text>
<text x="282.5" y="550" font-size="10" fill="#64748b" text-anchor="middle">confidence = 1.0 的 Code Connect 命中无需用户确认，直接替换</text>
</svg>
